name: OTA Update (preview)

# Publishes a JS/asset-only over-the-air update to the `preview` channel on
# every push to main, so the installed preview build picks it up on next launch.
# Native changes (new module/permission, icon/splash, app.json native fields,
# version bump) are NOT covered here - those still need `eas build`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ota-preview
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install eas-cli
        run: npm i -g eas-cli

      - name: Export Android bundle (no bytecode)
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_NO_TELEMETRY: "1"
          EAS_SKIP_AUTO_FINGERPRINT: "1"
        run: npx expo export --platform android --no-bytecode --output-dir dist

      - name: Publish OTA update to preview channel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          MSG=$(printf '%s' "${COMMIT_MSG:-Manual OTA update}" | head -n1)
          echo "Publishing: $MSG"
          eas update \
            --branch preview \
            --environment preview \
            --skip-bundler \
            --input-dir dist \
            --message "$MSG" \
            --non-interactive
